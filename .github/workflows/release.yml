name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Static Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Build Static Release Binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Prepare Release Asset
        run: |
          cp target/x86_64-unknown-linux-musl/release/rtmp-proxy rtmp-proxy
          sha256sum rtmp-proxy > rtmp-proxy.sha256

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            rtmp-proxy
            rtmp-proxy.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Deployment Reconciliation
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          DEPLOYMENT_WEBHOOK_URL: ${{ secrets.DEPLOYMENT_WEBHOOK_URL }}
          DEPLOYMENT_WEBHOOK_SECRET: ${{ secrets.DEPLOYMENT_WEBHOOK_SECRET }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          python3 - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import urllib.request

          payload = json.dumps(
              {
                  "action": "published",
                  "release": {"tag_name": os.environ["RELEASE_TAG"]},
                  "repository": {"id": int(os.environ["REPOSITORY_ID"])},
              },
              separators=(",", ":"),
          ).encode()
          signature = hmac.new(
              os.environ["DEPLOYMENT_WEBHOOK_SECRET"].encode(),
              payload,
              hashlib.sha256,
          ).hexdigest()
          request = urllib.request.Request(
              os.environ["DEPLOYMENT_WEBHOOK_URL"],
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "rtmp-manager-release-workflow",
                  "X-GitHub-Event": "release",
                  "X-Hub-Signature-256": f"sha256={signature}",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              if response.status != 202:
                  raise RuntimeError(
                      f"deployment webhook returned HTTP {response.status}, expected 202"
                  )
          PY
