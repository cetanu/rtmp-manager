name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag to build, publish, and deploy
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check pull-request commits
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check pushed commits
        if: github.event_name == 'push'
        uses: webiny/action-conventional-commits@v1.3.0

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  check:
    name: Check and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test release (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    services:
      rtmp:
        image: bluenviron/mediamtx:1.20.1
        ports:
          - 1935:1935
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Topcoat CLI
        uses: taiki-e/install-action@v2
        with:
          tool: topcoat-cli@0.8.0
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Build release binary and assets
        run: topcoat asset bundle --release --bin rtmp-proxy
      - run: cargo test --release --all-targets --all-features --locked
      - name: Test FFmpeg publishing to RTMP
        run: cargo test --release --locked server::relay::tests::direct_test_publishes_to_local_rtmp_server -- --ignored --exact
      - name: Package tested release
        run: |
          mkdir release
          cp target/release/rtmp-proxy release/rtmp-proxy
          cp -R target/release/assets release/assets
          tar -C release -czf "rtmp-proxy-${{ matrix.arch }}.tar.gz" .
          sha256sum "rtmp-proxy-${{ matrix.arch }}.tar.gz" > "rtmp-proxy-${{ matrix.arch }}.tar.gz.sha256"
      - name: Preserve tested release
        uses: actions/upload-artifact@v4
        with:
          name: rtmp-proxy-${{ matrix.arch }}
          path: |
            rtmp-proxy-${{ matrix.arch }}.tar.gz
            rtmp-proxy-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create draft release
    needs: [commitlint, audit, check, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Get released tag
        id: release
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag="$(jq -r '.[0].tag // empty' <<< "$RELEASES")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release-pr:
    name: Prepare release pull request
    needs: [commitlint, audit, check, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-binary:
    name: Upload tested Linux binaries
    needs: [release, test]
    if: always() && needs.test.result == 'success' && (needs.release.outputs.tag != '' || github.event.inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested releases
        uses: actions/download-artifact@v4
        with:
          pattern: rtmp-proxy-*
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag || github.event.inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" rtmp-proxy-*.tar.gz rtmp-proxy-*.tar.gz.sha256 --clobber --repo "$REPOSITORY"

  publish-release:
    name: Publish GitHub release
    needs: [release, upload-binary]
    if: always() && needs.upload-binary.result == 'success' && (needs.release.outputs.tag != '' || github.event.inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag || github.event.inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --draft=false

  reconcile-deployment:
    name: Trigger deployment reconciliation
    needs: [release, publish-release]
    if: always() && needs.publish-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Notify deployment service
        env:
          DEPLOYMENT_WEBHOOK_URL: ${{ secrets.DEPLOYMENT_WEBHOOK_URL }}
          DEPLOYMENT_WEBHOOK_SECRET: ${{ secrets.DEPLOYMENT_WEBHOOK_SECRET }}
          RELEASE_TAG: ${{ needs.release.outputs.tag || github.event.inputs.release_tag }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          python3 - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import urllib.request

          payload = json.dumps(
              {
                  "action": "published",
                  "release": {"tag_name": os.environ["RELEASE_TAG"]},
                  "repository": {"id": int(os.environ["REPOSITORY_ID"])},
              },
              separators=(",", ":"),
          ).encode()
          signature = hmac.new(
              os.environ["DEPLOYMENT_WEBHOOK_SECRET"].encode(),
              payload,
              hashlib.sha256,
          ).hexdigest()
          request = urllib.request.Request(
              os.environ["DEPLOYMENT_WEBHOOK_URL"],
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "rtmp-manager-release-workflow",
                  "X-GitHub-Event": "release",
                  "X-Hub-Signature-256": f"sha256={signature}",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              if response.status != 202:
                  raise RuntimeError(
                      f"deployment webhook returned HTTP {response.status}, expected 202"
                  )
          PY
