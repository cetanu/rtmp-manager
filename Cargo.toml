[package]
name = "rtmp-proxy"
version = "0.1.6"
edition = "2021"
authors = ["Vasilios Syrakis <syrakis@pm.me>"]
description = "Self-hosted RTMP multiplexer and management dashboard"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
rtmp-rs = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde_json = "1.0.151"
hmac = "0.12.1"
sha2 = "0.10.9"
time = { version = "0.3.54", features = ["parsing"] }
topcoat = { version = "0.4.0", features = ["ui", "tailwind", "asset", "multipart", "runtime"] }
serde_qs = "1.1.2"
rusqlite = { version = "0.38.0", features = ["bundled"] }
base64 = "0.22.1"
bytes = "1"
futures-util = "0.3"
http-body = "1"
http-body-util = "0.1"

[build-dependencies]
topcoat = { version = "0.4.0", default-features = false, features = ["tailwind"] }
