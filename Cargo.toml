[package]
name = "rtmp-proxy"
version = "0.3.20"
edition = "2024"
rust-version = "1.95"
authors = ["Vasilios Syrakis <syrakis@pm.me>"]
description = "Self-hosted RTMP multiplexer and management dashboard"
repository = "https://github.com/cetanu/rtmp-manager"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
rtmp-rs = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["form", "json", "query"] }
serde_json = "1.0.151"
serde_valid = "2.0"
hmac = "0.12.1"
sha2 = "0.10.9"
time = { version = "0.3.54", features = ["parsing"] }
topcoat = { version = "0.8.0", features = ["ui", "tailwind", "asset", "multipart", "runtime", "sse"] }
serde_qs = "1.1.2"
toasty = { version = "0.10", features = ["sqlite", "migration"] }
toasty-cli = { version = "0.10" }
base64 = "0.22.1"
futures-util = "0.3"
regex = "1.10"
parking_lot = "0.12"
aws-lc-rs = "1.17.3"
srt-tokio = "0.4.4"

[build-dependencies]
topcoat = { version = "0.8.0", default-features = false, features = ["tailwind"] }

[dev-dependencies]
bytes = "1.0"
topcoat-asset = { version = "0.8.0", features = ["bundler"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
