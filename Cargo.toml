[workspace]
members = ["crates/core", "crates/web"]
default-members = [".", "crates/core", "crates/web"]
resolver = "3"

[workspace.package]
version = "0.12.2"

[package]
name = "rtmp-proxy"
version.workspace = true
edition = "2024"
default-run = "rtmp-proxy"
rust-version = "1.99"
authors = ["Vasilios Syrakis <syrakis@pm.me>"]
description = "Self-hosted RTMP multiplexer and management dashboard"
repository = "https://github.com/cetanu/rtmp-manager"

[dependencies]
rtmp-core = { path = "crates/core" }
rtmp-web = { path = "crates/web" }
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
reqwest = { version = "0.13.4", features = ["form", "json", "query"] }
time = { version = "0.3.54", features = ["parsing"] }
toasty-cli = { version = "0.11" }

[dev-dependencies]
topcoat = { version = "0.12.0", features = ["asset", "runtime"] }
bytes = "1.0"
topcoat-asset = { version = "0.12.0", features = ["bundler"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
