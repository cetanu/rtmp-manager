[package]
name = "rtmp-core"
version.workspace = true
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
rtmp-rs = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["form", "json", "query"] }
serde_json = "1.0.151"
serde_valid = "2.0"
hmac = "0.12.1"
sha2 = "0.10.9"
time = { version = "0.3.54", features = ["parsing"] }
topcoat = { version = "0.12.0", features = ["anyhow", "ui", "tailwind", "asset", "multipart", "runtime", "sse", "l10n-datetime", "l10n-number"] }
serde_qs = "1.1.2"
toasty = { version = "0.11", features = ["sqlite", "migration"] }
base64 = "0.22.1"
futures-util = "0.3"
regex = "1.10"
rhai = { version = "1.21", features = ["sync", "serde", "no_module"] }
parking_lot = "0.12"
aws-lc-rs = "1.17.3"
srt-tokio = "0.4.4"


[dev-dependencies]
bytes = "1.0"
