[workspace]
# The release PR is the single source of truth for the package version and tag.
git_tag_enable = true

# A release is only public after its binary and checksum are attached.
git_release_draft = true

# This application is distributed through GitHub releases, not crates.io.
publish = false

[[package]]
name = "rtmp-proxy"
# Determine unpublished versions from Git tags matching v*
git_only = true
git_tag_name = "v{{ version }}"
# Include commits from workspace crates in the server release changelog
changelog_include = ["rtmp-core", "rtmp-web"]

[[package]]
name = "rtmp-core"
release = false

[[package]]
name = "rtmp-web"
release = false
